tls:
  certificates:
    - certFile: /certs/local-dev.crt
      keyFile: /certs/local-dev.key
  stores:
    default:
      defaultCertificate:
        certFile: /certs/local-dev.crt
        keyFile: /certs/local-dev.key

http:
  routers:
    forgejo:
      rule: Host(`forgejo.dev`) || Host(`forgejo.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: forgejo
    sonarqube:
      rule: Host(`sonar.dev`) || Host(`sonar.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: sonarqube
    rancher:
      rule: Host(`rancher.dev`) || Host(`rancher.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: rancher
    chartmuseum:
      rule: Host(`helm.dev`) || Host(`helm.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: chartmuseum
    go-loose:
      rule: Host(`auth.dev`) || HostRegexp(`[a-z0-9-]+\.auth\.dev`) || Host(`auth.urpi.be`) || HostRegexp(`[a-z0-9-]+\.auth\.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: go-loose
    go-guess:
      rule: HostRegexp(`[a-z0-9-]+\.guess\.dev`) || HostRegexp(`[a-z0-9-]+\.guess\.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: go-guess
    go-tell:
      rule: Host(`tell.dev`) || Host(`tell.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: go-tell
    traefik:
      rule: Host(`traefik.dev`) || Host(`traefik.urpi.be`)
      entryPoints: [websecure]
      tls: {}
      service: api@internal
      middlewares: [traefik-auth]
  middlewares:
    # The dashboard is an admin interface, so it is never left open. The hash
    # lives in a gitignored file next to the certificate and is generated with
    # bcrypt, the only format Traefik accepts for basic auth.
    traefik-auth:
      basicAuth:
        usersFile: /certs/traefik-dashboard-users
  services:
    forgejo:
      loadBalancer:
        servers:
          - url: http://forgejo:3000
    sonarqube:
      loadBalancer:
        servers:
          - url: http://sonarqube:9000
    rancher:
      loadBalancer:
        servers:
          - url: http://rancher:80
    chartmuseum:
      loadBalancer:
        servers:
          - url: http://chartmuseum:8080
    go-loose:
      loadBalancer:
        servers:
          - url: http://go-loose:8080
    go-guess:
      loadBalancer:
        servers:
          - url: http://go-guess-web:80
    go-tell:
      loadBalancer:
        servers:
          - url: http://go-tell:8080
