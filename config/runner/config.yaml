log:
  level: info

runner:
  file: /config/.runner
  capacity: 2
  timeout: 3h
  shutdown_timeout: 30s
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - docker:docker://ghcr.io/catthehacker/ubuntu:act-22.04
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04

cache:
  enabled: true
  dir: /data/cache
  host: ""
  port: 0

container:
  network: local-dev-edge
  privileged: false
  options: >-
    -v /home/dnoulet/sources/go/infrastructure/certs/local-ca.crt:/usr/local/share/ca-certificates/local-dev-ca.crt:ro
    -v /home/dnoulet/sources/go/infrastructure/config/runner/gitconfig:/etc/gitconfig:ro
    --group-add 967
    -e NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/local-dev-ca.crt
  valid_volumes:
    - /home/dnoulet/sources/go/infrastructure/certs/local-ca.crt
    - /home/dnoulet/sources/go/infrastructure/config/runner/gitconfig
    - /var/run/docker.sock
  docker_host: unix:///var/run/docker.sock
  force_pull: true
